<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — slop not found</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
@font-face { font-family: "Rubik Wet Paint"; src: url(/fonts/rubik-wet-paint.woff2) format("woff2"); font-display: swap; }
@font-face { font-family: "Comic Neue"; font-weight: 700; src: url(/fonts/comic-neue-700.woff2) format("woff2"); font-display: swap; }
:root { color-scheme: light; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 16px;
  background: #fbf3dc; color: #2a2118; font: 700 20px/1.5 "Comic Neue", "Comic Sans MS", cursive; }
h1 { margin: 0; font: 400 clamp(90px, 30vw, 220px)/1 "Rubik Wet Paint", cursive; color: #7bd43a;
  -webkit-text-stroke: 4px #2a2118; paint-order: stroke fill; text-shadow: 6px 8px 0 #ff5fa2; rotate: -4deg; }
.pig { font-size: 90px; display: inline-block; animation: roll 3s ease-in-out infinite; }
@keyframes roll { 50% { transform: translateX(40px) rotate(20deg); } }
a { color: #b5005b; text-decoration-style: wavy; }
@media (prefers-reduced-motion: reduce) { .pig { animation: none; } }
</style>
</head>
<body>
<main>
  <h1>404</h1>
  <div class="pig" aria-hidden="true">🐖</div>
  <p>this slop has already been eaten.<br>Gerald says sorry. (Gerald is not sorry.)</p>
  <p><a href="/">← back to the trough</a></p>
</main>
</body>
</html>
