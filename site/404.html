<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — it's over</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
@font-face { font-family: "Rubik Wet Paint"; src: url(/fonts/rubik-wet-paint.woff2) format("woff2"); font-display: swap; }
@font-face { font-family: "Comic Neue"; font-weight: 700; src: url(/fonts/comic-neue-700.woff2) format("woff2"); font-display: swap; }
:root { color-scheme: light; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 16px;
  background: #eef2ff; color: #16152a; font: 700 20px/1.5 "Comic Neue", "Comic Sans MS", cursive; }
h1 { margin: 0; font: 400 clamp(90px, 30vw, 220px)/1 "Rubik Wet Paint", cursive; color: #7bd43a;
  -webkit-text-stroke: 4px #16152a; paint-order: stroke fill; text-shadow: 6px 8px 0 #5865f2; rotate: -4deg; }
.slop { font-size: 90px; display: inline-block; animation: roll 3s ease-in-out infinite; }
@keyframes roll { 50% { transform: translateX(40px) rotate(20deg); } }
a { color: #2f3ab2; text-decoration-style: wavy; }
@media (prefers-reduced-motion: reduce) { .slop { animation: none; } }
</style>
</head>
<body>
<main>
  <h1>404</h1>
  <div class="slop" aria-hidden="true">🤓</div>
  <p>it's over. this page does not exist.<br>like slop's social life. (we're so back if you click below.)</p>
  <p><a href="/">← back to the basement</a></p>
</main>
<script>try { localStorage.setItem("slop:found404", "true"); } catch { /* the passport will never know */ }</script>
</body>
</html>
